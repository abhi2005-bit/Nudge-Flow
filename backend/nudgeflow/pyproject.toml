[project]
name = "nudgeflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhijit Sinha", email = "sinhaabhijit414@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nudgeflow = "nudgeflow:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
